[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sec-rag"
version = "0.1.0"
description = "RAG pipeline for querying SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sec-rag = "sec_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
